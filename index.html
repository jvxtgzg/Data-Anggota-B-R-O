<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRO Database (Google Sheet)</title>
<style>
body{font-family:Arial;background:#111827;color:#fff;text-align:center;padding:20px}
input,button{padding:10px;margin:5px;border-radius:8px;border:none}
button{background:#2563eb;color:white;cursor:pointer}
.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px}
table{width:100%;margin-top:20px;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #444}
th{background:#374151}
</style>
</head>
<body>

<div style="background:#1f2937;padding:15px;border-radius:10px;margin-bottom:20px;">
<img src="https://raw.githubusercontent.com/jvxtgzg/Data-Anggota-B-R-O/main/BRO%20LOGO.png" alt="BRO LOGO" style="height:80px;display:block;margin:auto;">
<h2 style="margin:10px 0 0 0;">Bureau of Response Operations</h2>
</div>

<div id="access">
<h1>BRO Member Access</h1>
<input type="password" id="pin" placeholder="Enter PIN">
<button type="button" onclick="togglePin(this)">View PIN</button>
<button onclick="login()">Access</button>
<p id="err" style="color:red;display:none">Wrong PIN</p>
</div>

<div id="data" style="display:none">
<h2>Member Database</h2>

<div class="controls">
<input type="text" id="search" placeholder="Search Code Name / Callsign" onkeyup="searchData()">
<button onclick="refreshData()">Refresh</button>
</div>

<table>
<thead>
<tr>
<th>No</th>
<th>Nama</th>
<th>Code Name</th>
<th>Callsign</th>
<th>Division</th>
<th>Rank</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

<script>
const PIN = "BRO-1222";
const sheetURL = "https://opensheet.elk.sh/1yVsYlFJkPeIp6p3LApsiW4Ivv_5XihznO7BJLf_VRsY/Sheet1";

let allData = [];

function login(){
  const input = document.getElementById("pin").value.trim();

  if(input === PIN){
    document.getElementById("access").style.display = "none";
    document.getElementById("data").style.display = "block";
    document.getElementById("err").style.display = "none";
    loadData();
  }else{
    document.getElementById("err").style.display = "block";
  }
}

function togglePin(btn){
  const pin = document.getElementById("pin");

  if(pin.type === "password"){
    pin.type = "text";
    btn.textContent = "Hide PIN";
  }else{
    pin.type = "password";
    btn.textContent = "View PIN";
  }
}

async function loadData(){
  try{
    const res = await fetch(sheetURL, { cache: "no-store" });
    allData = await res.json();
    renderTable(allData);
  }catch(err){
    console.error("DATA LOAD ERROR:", err);
    alert("Gagal load database");
  }
}

function refreshData(){
  document.getElementById("search").value = "";
  loadData();
}

function renderTable(data){
  const table = document.getElementById("table");
  table.innerHTML = "";

  if(!data || data.length === 0){
    table.innerHTML = "<tr><td colspan='6'>No Data</td></tr>";
    return;
  }

  data.forEach((row,i)=>{
    table.innerHTML += `
    <tr>
      <td>${i+1}</td>
      <td>${row.NAMA || "-"}</td>
      <td>${row["CODE NAME"] || "-"}</td>
      <td>${row.CALLSIGN || "-"}</td>
      <td>${row.DIVISION || "-"}</td>
      <td>${row.RANK || "-"}</td>
    </tr>`;
  });
}

function searchData(){
  const keyword = document.getElementById("search").value.toLowerCase();

  const filtered = allData.filter(row =>
    (row["CODE NAME"] && row["CODE NAME"].toLowerCase().includes(keyword)) ||
    (row.CALLSIGN && row.CALLSIGN.toLowerCase().includes(keyword))
  );

  renderTable(filtered);
}
</script>

</body>
</html>
