<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRO Database (Google Sheet)</title>
<style>
body{font-family:Arial;background:#111827;color:#fff;text-align:center;padding:20px}
input,button{padding:10px;margin:5px;border-radius:8px;border:none}
button{background:#2563eb;color:white;cursor:pointer}
table{width:100%;margin-top:20px;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #444}
th{background:#374151}
</style>
</head>
<body>

<!-- HEADER LOGO -->
<div style="background:#1f2937;padding:15px;border-radius:10px;margin-bottom:20px;">
<img src="https://raw.githubusercontent.com/jvxtgzg/Data-Anggota-B-R-O/main/BRO%20LOGO.png" alt="BRO LOGO" style="height:80px;display:block;margin:auto;">
<h2 style="margin:10px 0 0 0;">Bureau of Response Operations</h2>
</div>

<h1>BRO Member Access</h1>
<input type="password" id="pin" placeholder="Enter PIN">
<button onclick="login()">Access</button>
<p id="err" style="color:red;display:none">Wrong PIN</p>

<div id="data" style="display:none">
<h2>Member Database</h2>

<!-- 🔍 SEARCH -->
<input type="text" id="search" placeholder="Search Code Name / Callsign" onkeyup="searchData()">

<table>
<thead>
<tr>
<th>No</th>
<th>Nama</th>
<th>Code Name</th>
<th>Callsign</th>
<th>Division</th>
<th>Rank</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

<script>
// =======================
// CONFIG
// =======================
const sheetURL = "https://opensheet.elk.sh/1yVsYlFJkPeIp6p3LApsiW4Ivv_5XihznO7BJLf_VRsY/Sheet1";

// endpoint Anda (mode read PIN)
const PIN_API  = "https://script.google.com/macros/s/AKfycbw90vXeRd_andUcgzX8aUqnKoN2eHJwvAHvFOMelzetk1Iu6n0FhQ74ZfICTeJcr4S9/exec?action=get";

let PIN = null;
let allData = [];

// =======================
// INIT
// =======================
window.onload = () => {
  loadPIN();
};

// =======================
// LOAD PIN (E1)
// =======================
async function loadPIN(){
  try{
    const res = await fetch(PIN_API);
    const data = await res.json();

    // pastikan string bersih
    PIN = (data.pin || "").toString().trim();

    console.log("PIN READY:", PIN);
  }catch(err){
    console.error("PIN LOAD ERROR:", err);
    alert("Gagal ambil PIN dari server");
  }
}

// =======================
// LOGIN
// =======================
function login(){
  const input = document.getElementById("pin").value.trim();

  if(PIN === null){
    alert("Tunggu, sistem belum siap");
    return;
  }

  if(input === PIN){
    document.getElementById("data").style.display = "block";
    document.getElementById("err").style.display = "none";
    loadData();
  }else{
    document.getElementById("err").style.display = "block";
  }
}

// =======================
// LOAD DATA
// =======================
async function loadData(){
  try{
    const res = await fetch(sheetURL);
    allData = await res.json();
    renderTable(allData);
  }catch(err){
    console.error("DATA LOAD ERROR:", err);
    alert("Gagal load database");
  }
}

// =======================
// RENDER TABLE
// =======================
function renderTable(data){
  const table = document.getElementById("table");
  table.innerHTML = "";

  if(!data || data.length === 0){
    table.innerHTML = "<tr><td colspan='6'>No Data</td></tr>";
    return;
  }

  data.forEach((row,i)=>{
    table.innerHTML += `
    <tr>
      <td>${i+1}</td>
      <td>${row.NAMA || "-"}</td>
      <td>${row["CODE NAME"] || "-"}</td>
      <td>${row.CALLSIGN || "-"}</td>
      <td>${row.DIVISION || "-"}</td>
      <td>${row.RANK || "-"}</td>
    </tr>`;
  });
}

// =======================
// SEARCH
// =======================
function searchData(){
  const keyword = document.getElementById("search").value.toLowerCase();

  const filtered = allData.filter(row =>
    (row["CODE NAME"] && row["CODE NAME"].toLowerCase().includes(keyword)) ||
    (row.CALLSIGN && row.CALLSIGN.toLowerCase().includes(keyword))
  );

  renderTable(filtered);
}
</script>

</body>
</html>
